name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test

  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Developer ID Application の証明書と公証用の App Store Connect API キーを一時的なキーチェーンに入れる。
      # シークレットを参照できない PR（fork からの PR など）では何もせず、次のステップで ad-hoc 署名にする
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }} # p12 にパスワードを付けていなければ未設定（空文字）でよい
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/import-certificate.sh

      # リリースと同じ手順でユニバーサルな zip を作る。公証は時間がかかるためタグのとき（release.yaml）だけ行い、
      # ここでは Developer ID での署名までにする（シークレットを参照できない PR では ad-hoc 署名）
      - name: Build release zip
        id: build
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: |
          version="$(sed -n 's/.*current = "\(.*\)"/\1/p' Sources/Taffy/Version.swift)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          scripts/release.sh "${version}"

      # 最新の Homebrew で cask を読み込み、非推奨の書き方などの警告が出ないことを確認する
      - name: Check cask template
        env:
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew update --quiet
          brew tap-new --no-git local/taffy
          brew trust local/taffy
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-taffy"
          mkdir -p "${tap_dir}/Casks"
          scripts/cask.sh "${{ steps.build.outputs.version }}" "${{ steps.build.outputs.sha256 }}" > "${tap_dir}/Casks/taffy.rb"
          brew info --cask local/taffy/taffy 2>&1 | tee "${RUNNER_TEMP}/brew-info.log"
          if grep -q -i "warning\|error" "${RUNNER_TEMP}/brew-info.log"; then
            echo "::error::brew が cask について警告を出しました"
            exit 1
          fi
          brew style --cask local/taffy/taffy

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Taffy
          path: ${{ steps.build.outputs.zip }}
