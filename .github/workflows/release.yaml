name: Release

# v* タグの push で Release と Homebrew の cask を更新する（PR でのビルドとテストは ci.yaml）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test

      # Developer ID Application の証明書と公証用の App Store Connect API キーを一時的なキーチェーンに入れ、
      # 次のステップの scripts/release.sh に公証に使うプロファイルとキーチェーンを渡す
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }} # p12 にパスワードを付けていなければ未設定（空文字）でよい
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          TAFFY_NOTARIZE: "1"
        run: scripts/import-certificate.sh

      # Developer ID で署名・公証し、公証のチケットを staple したユニバーサルな zip を作る
      - name: Build release zip
        id: build
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: |
          version="$(sed -n 's/.*current = "\(.*\)"/\1/p' Sources/Taffy/Version.swift)"
          if [[ "${GITHUB_REF}" == refs/tags/* && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と Version.swift の ${version} が一致しません"
            exit 1
          fi
          # ad-hoc 署名や未公証のまま公開しないようにする
          if [[ "${CODESIGN_IDENTITY}" == "-" || -z "${TAFFY_NOTARY_PROFILE:-}" ]]; then
            echo "::error::リリースには Developer ID での署名と公証が必要です（シークレットを確認してください）"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          scripts/release.sh "${version}"

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            taffy
            homebrew-cask

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          # tagpr が Release を作っていればファイルを追加し、なければ作る
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIP}" "${ZIP}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIP}" "${ZIP}.sha256" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          TAP: ${{ github.repository_owner }}/homebrew-cask
        run: |
          tap_dir="${RUNNER_TEMP}/tap"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" "${tap_dir}"
          mkdir -p "${tap_dir}/Casks"
          scripts/cask.sh "${VERSION}" "${SHA256}" > "${tap_dir}/Casks/taffy.rb"
          cd "${tap_dir}"
          if git diff --quiet -- Casks/taffy.rb && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "cask に変更はありません"
            exit 0
          fi
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Casks/taffy.rb
          git commit -m "Brew cask update for taffy version v${VERSION}"
          git push origin HEAD
